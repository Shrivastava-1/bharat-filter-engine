
name: Groq AI Documentation Generator

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-documentation:
    name: Generate README and Changelog
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your fork
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      # 2. Verify repository
      - name: Verify repository
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"

          if [ "$GITHUB_REPOSITORY" != "Shrivastava-1/bharat-filter-engine" ]; then
            echo "Unexpected repository. Stopping."
            exit 1
          fi

      # 3. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade openai

      # 5. Generate documentation using Groq
      - name: Generate documentation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
        run: |
          python scripts/ai_docs/generate_docs.py

      # 6. Check generated changes
      - name: Check documentation changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- README.md CHANGELOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No documentation changes generated."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Documentation changes detected."
            git diff --stat -- README.md CHANGELOG.md
          fi

      # 7. Create Pull Request
      - name: Create documentation Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update README and changelog using Groq"
          branch: ai/groq-documentation-update
          delete-branch: true
          title: "docs: Groq AI documentation update"
          body: |
            ## Documentation update

            Generated using Groq API.

            Model: openai/gpt-oss-120b

            Files updated:
            - README.md
            - CHANGELOG.md

            Please review all generated changes before merging.
          add-paths: |
            README.md
            CHANGELOG.md

      # 8. Final result
      - name: Finish
        run: |
          echo "Groq documentation workflow completed."
