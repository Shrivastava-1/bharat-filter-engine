
name: Update Release Documentation

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to document (e.g. v0.3.0)"
        required: true
        type: string
      force:
        description: "Regenerate even if CHANGELOG already contains this version"
        required: false
        type: boolean
        default: false

# Minimum permissions by default.
permissions:
  contents: read

# Prevent duplicate runs for the same release.
concurrency:
  group: release-docs-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  update-docs:
    # IMPORTANT: This must match your actual GitHub repository.
    if: github.repository == 'Shrivastava-1/bharat-filter-engine'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      pull-requests: write

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}

    steps:

      # --------------------------------------------------
      # 1. Checkout default branch
      # --------------------------------------------------

      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      # --------------------------------------------------
      # 2. Resolve release and previous version
      # --------------------------------------------------

      - name: Resolve release and previous tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          TAG_RE='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

          if ! [[ "$RELEASE_TAG" =~ $TAG_RE ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

          git fetch --force --tags origin

          if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null; then
            echo "::error::Release tag does not exist: $RELEASE_TAG"
            exit 1
          fi

          # Find the previous valid version tag.
          PREV=$(
            git -c versionsort.suffix=- tag \
              --list 'v[0-9]*' \
              --sort=v:refname |
            grep -E "$TAG_RE" |
            awk -v target="$RELEASE_TAG" '
              $0 == target {
                print previous
                found=1
                exit
              }
              {
                previous=$0
              }
              END {
                if (!found) exit 1
              }
            '
          ) || {
            echo "::error::Target release tag not found in sorted tags"
            exit 1
          }

          VERSION="${RELEASE_TAG#v}"

          FIRST_RELEASE=false
          if [ -z "$PREV" ]; then
            FIRST_RELEASE=true
          fi

          SKIP=false

          if grep -qF "## [${VERSION}]" CHANGELOG.md 2>/dev/null \
            && [ "$FORCE" != "true" ]; then
            echo "::notice::Version ${VERSION} already exists in CHANGELOG.md"
            SKIP=true
          fi

          {
            echo "tag=$RELEASE_TAG"
            echo "version=$VERSION"
            echo "previous=$PREV"
            echo "first_release=$FIRST_RELEASE"
            echo "skip=$SKIP"
          } >> "$GITHUB_OUTPUT"

          echo "Target release: $RELEASE_TAG"
          echo "Previous release: ${PREV:-None}"
          echo "First release: $FIRST_RELEASE"
          echo "Skip generation: $SKIP"

      # --------------------------------------------------
      # 3. Setup Python
      # --------------------------------------------------

      - name: Setup Python
        if: steps.release.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/docs/requirements.txt

      # --------------------------------------------------
      # 4. Install dependencies
      # --------------------------------------------------

      - name: Install dependencies
        if: steps.release.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/docs/requirements.txt

      # --------------------------------------------------
      # 5. Analyze release
      # --------------------------------------------------

      - name: Analyze release
        id: analyze
        if: steps.release.outputs.skip != 'true'
        env:
          PREVIOUS_TAG: ${{ steps.release.outputs.previous }}
          FIRST_RELEASE: ${{ steps.release.outputs.first_release }}
        run: |
          set -euo pipefail

          python scripts/docs/analyze_release.py

          if [ ! -f release-analysis.json ]; then
            echo "::error::release-analysis.json was not generated"
            exit 1
          fi

          HAS_CHANGES=$(python - <<'PY'
          import json
          import sys

          with open("release-analysis.json", encoding="utf-8") as f:
              data = json.load(f)

          # Prefer comprehensive change detection.
          keys = (
              "has_relevant_changes",
              "has_changes",
              "has_lib_changes"
          )

          for key in keys:
              if key in data:
                  print(str(bool(data[key])).lower())
                  break
          else:
              sys.exit("No supported change-detection field found in analysis JSON")
          PY
          )

          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"

          echo "Relevant changes detected: $HAS_CHANGES"

      # --------------------------------------------------
      # 6. Generate README and CHANGELOG using Gemini
      # --------------------------------------------------

      - name: Generate documentation
        if: steps.analyze.outputs.has_changes == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PREVIOUS_TAG: ${{ steps.release.outputs.previous }}
          FIRST_RELEASE: ${{ steps.release.outputs.first_release }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::GEMINI_API_KEY secret is not configured"
            exit 1
          fi

          python scripts/docs/generate_docs.py

      # --------------------------------------------------
      # 7. Validate generated documentation
      # --------------------------------------------------

      - name: Validate documentation
        if: steps.analyze.outputs.has_changes == 'true'
        env:
          PREVIOUS_TAG: ${{ steps.release.outputs.previous }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          python scripts/docs/validate_docs.py

      # --------------------------------------------------
      # 8. Check generated files
      # --------------------------------------------------

      - name: Verify documentation changes
        id: scope
        if: steps.analyze.outputs.has_changes == 'true'
        run: |
          set -euo pipefail

          git diff --check

          CHANGED=$(git diff --name-only)

          UNEXPECTED=$(printf '%s\n' "$CHANGED" |
            grep -vxE 'README\.md|CHANGELOG\.md' |
            grep -v '^$' || true)

          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Unexpected files modified:"
            echo "$UNEXPECTED"
            exit 1
          fi

          if ! git diff --quiet -- README.md CHANGELOG.md; then
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
            echo "Documentation changes detected."
          else
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No documentation changes generated."
          fi

      # --------------------------------------------------
      # 9. Build Pull Request description
      # --------------------------------------------------

      - name: Build PR description
        if: steps.scope.outputs.has_diff == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          PREV: ${{ steps.release.outputs.previous }}
        run: |
          set -euo pipefail

          {
            echo "## Release Documentation Update"
            echo
            echo "- **Target release:** \`$TAG\`"

            if [ -n "$PREV" ]; then
              echo "- **Previous release:** \`$PREV\`"
            else
              echo "- **Previous release:** None (first release)"
            fi

            echo
            echo "### Analyzed Changes"

            if [ -n "$PREV" ]; then
              echo '```'
              git diff --shortstat "$PREV" "$TAG" -- \
                lib spec '*.gemspec' Gemfile Gemfile.lock
              echo
              git diff --name-status "$PREV" "$TAG" -- \
                lib spec '*.gemspec' Gemfile Gemfile.lock
              echo '```'
            else
              echo "Initial release; no previous version available for comparison."
            fi

            echo
            echo "### Documentation Files Updated"
            echo "- README.md"
            echo "- CHANGELOG.md"

            echo
            echo "### Validation"
            echo "- Documentation validation: Passed"
            echo "- Git whitespace validation: Passed"
            echo "- Only intended documentation files were modified."

            echo
            echo "### Review Required"
            echo "Please review AI-generated documentation against the actual source code changes before merging."

            echo
            echo "This PR is not automatically merged."
          } > "$RUNNER_TEMP/pr-body.md"

      # --------------------------------------------------
      # 10. Create or update Pull Request
      # --------------------------------------------------

      - name: Create or update documentation PR
        if: steps.scope.outputs.has_diff == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: docs/release-${{ steps.release.outputs.tag }}
          delete-branch: true
          add-paths: |
            README.md
            CHANGELOG.md
          commit-message: "docs: update release documentation for ${{ steps.release.outputs.tag }}"
          title: "docs: release documentation for ${{ steps.release.outputs.tag }}"
          body-path: ${{ runner.temp }}/pr-body.md

      # --------------------------------------------------
      # 11. Upload analysis artifact
      # --------------------------------------------------

      - name: Upload analysis artifacts
        if: always() && steps.release.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-docs-${{ github.run_id }}
          path: release-analysis.json
          if-no-files-found: ignore
          retention-days: 14

      # --------------------------------------------------
      # 12. Job summary
      # --------------------------------------------------

      - name: Job summary
        if: always()
        env:
          TAG: ${{ steps.release.outputs.tag }}
          PREV: ${{ steps.release.outputs.previous }}
          SKIP: ${{ steps.release.outputs.skip }}
          CHANGES: ${{ steps.analyze.outputs.has_changes }}
          PR: ${{ steps.scope.outputs.has_diff }}
        run: |
          {
            echo "## Release Documentation Summary"
            echo
            echo "- Target release: ${TAG:-Not resolved}"
            echo "- Previous release: ${PREV:-None}"
            echo "- Already documented: ${SKIP:-Unknown}"
            echo "- Relevant changes detected: ${CHANGES:-Not analyzed}"
            echo "- Documentation PR required: ${PR:-Not evaluated}"
          } >> "$GITHUB_STEP_SUMMARY"
