name: Inspect Git Changes

on:
  push:
    branches-ignore:
      - development
  pull_request:
    branches:
      - development
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      branch:
        description: "Feature branch to inspect"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: inspect-${{ github.event.pull_request.head.ref || inputs.branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || (inputs.branch != '' && inputs.branch) || github.sha }}
          fetch-depth: 0

      - name: Build comparison report
        shell: bash
        env:
          INSPECTED_BRANCH: ${{ github.event.pull_request.head.ref || inputs.branch || github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$INSPECTED_BRANCH" = "development" ]; then
            echo "The development branch is the comparison base, not a feature branch."
            exit 1
          fi

          git fetch origin development
          git fetch origin "$INSPECTED_BRANCH" || true

          SAFE_BRANCH="${INSPECTED_BRANCH//\//-}"
          mkdir -p comparison

          BASE="$(git merge-base origin/development HEAD)"
          if [ -z "$BASE" ]; then
            echo "Could not find a common ancestor with origin/development."
            exit 1
          fi

          {
            echo "# Branch Comparison: $INSPECTED_BRANCH"
            echo
            echo "- Base branch: development"
            echo "- Inspected branch: $INSPECTED_BRANCH"
            echo "- Commit: $(git rev-parse HEAD)"
            echo "- Comparison base: $BASE"
            echo
            echo "## Commit summary"
            git log --oneline --no-merges "$BASE..HEAD" || true
            echo
            echo "## Changed files"
            git diff --name-status "$BASE...HEAD" || true
            echo
            echo "## Change statistics"
            git diff --stat "$BASE...HEAD" || true
            echo
            echo "## Diff"
            git diff --no-ext-diff --unified=2 "$BASE...HEAD" -- \
              . ':!*.lock' ':!vendor' ':!node_modules' ':!dist' ':!build' || true
          } > "comparison/branch-${SAFE_BRANCH}.md"

          {
            echo "# Inspection Manifest"
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Branch: $INSPECTED_BRANCH"
            echo "- Base: development"
            echo "- Commit: $(git rev-parse HEAD)"
            echo "- Changed files: $(git diff --name-only "$BASE...HEAD" | wc -l | tr -d ' ')"
            echo
            echo "## Changed file list"
            git diff --name-status "$BASE...HEAD" || true
          } > comparison/manifest.md

          echo "Generated comparison files:"
          find comparison -maxdepth 1 -type f -print

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: bharat-filter-comparison-v2-${{ github.run_number }}
          path: comparison/
          if-no-files-found: error
          retention-days: 14
