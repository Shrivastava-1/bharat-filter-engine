name: Inspect Git Changes - V2

run-name: Git Comparison V2 - ${{ github.ref_name }}

on:
  push:
    branches-ignore:
      - development

permissions:
  contents: read

concurrency:
  group: inspect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    name: Compare Tags and Branches
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify and fetch repository
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_REPO="Shrivastava-1/bharat-filter-engine"

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF_NAME"

          if [ "$GITHUB_REPOSITORY" != "$EXPECTED_REPO" ]; then
            echo "ERROR: Unexpected repository."
            exit 1
          fi

          if [ "$GITHUB_REF_NAME" = "development" ]; then
            echo "Skipping the development branch."
            exit 0
          fi

          git fetch origin --prune --tags \
            '+refs/heads/*:refs/remotes/origin/*'

      - name: Generate Git comparison reports
        shell: bash
        env:
          DEFAULT_BRANCH: development
          INSPECTED_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          OUTPUT_DIR="comparison"
          mkdir -p "$OUTPUT_DIR"

          DEFAULT_REF="refs/remotes/origin/${DEFAULT_BRANCH}"
          BRANCH_REF="refs/remotes/origin/${INSPECTED_BRANCH}"

          if ! git show-ref --verify --quiet "$DEFAULT_REF"; then
            echo "ERROR: Default branch not found: $DEFAULT_BRANCH"
            exit 1
          fi

          if ! git show-ref --verify --quiet "$BRANCH_REF"; then
            echo "ERROR: Inspected branch not found: $INSPECTED_BRANCH"
            exit 1
          fi

          if ! git merge-base "$DEFAULT_REF" "$BRANCH_REF" >/dev/null; then
            echo "ERROR: No common ancestor with $DEFAULT_BRANCH."
            exit 1
          fi

          SAFE_NAME="${INSPECTED_BRANCH//\//-}"
          BRANCH_REPORT="$OUTPUT_DIR/branch-${SAFE_NAME}.md"

          {
            echo "# Branch Comparison: $INSPECTED_BRANCH"
            echo
            echo "## Repository"
            echo "$GITHUB_REPOSITORY"
            echo
            echo "## Default Branch"
            echo "$DEFAULT_BRANCH"
            echo
            echo "## Compared Branch"
            echo "$INSPECTED_BRANCH"
            echo
            echo "## Commit SHA"
            echo "$GITHUB_SHA"
            echo
            echo "## Commit Difference"
            echo "Commits ahead of default branch: $(git rev-list --count "$DEFAULT_REF..$BRANCH_REF")"
            echo "Commits behind default branch: $(git rev-list --count "$BRANCH_REF..$DEFAULT_REF")"
            echo
            echo "## Branch-specific Commits"
            git log --reverse --date=short \
              --format='- %h | %ad | %s' "$DEFAULT_REF..$BRANCH_REF" || true
            echo
            echo "## Changed Files"
            git diff --name-status "$DEFAULT_REF...$BRANCH_REF"
            echo
            echo "## Change Statistics"
            git diff --stat "$DEFAULT_REF...$BRANCH_REF"
            echo
            echo "## Actual Code Changes"
            git diff --no-ext-diff --unified=2 --find-renames \
              "$DEFAULT_REF...$BRANCH_REF" -- \
              '*.py' '*.rb' '*.js' '*.ts' '*.html' '*.css' \
              '*.toml' '*.cfg' '*.ini' '*.yml' '*.yaml' '*.md'
          } > "$BRANCH_REPORT"

          {
            echo "# Git Comparison Manifest - V2"
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Workflow run ID: $GITHUB_RUN_ID"
            echo "- Workflow run number: $GITHUB_RUN_NUMBER"
            echo "- Commit SHA: $GITHUB_SHA"
            echo "- Inspected branch: $INSPECTED_BRANCH"
            echo "- Default branch: $DEFAULT_BRANCH"
            echo "- Generated at (UTC): $(date -u)"
            echo
            echo "## Inspected Branch Changed Files"
            git diff --name-status "$DEFAULT_REF...$BRANCH_REF"
            echo
            echo "## Available Tags"
            git tag --list --sort=v:refname
            echo
            echo "## Available Remote Branches"
            git for-each-ref --format='%(refname:short)' refs/remotes/origin/ |
              grep -v '/HEAD$' || true
          } > "$OUTPUT_DIR/manifest.md"

          # Keep V2 release-to-release tag comparisons.
          mapfile -t TAGS < <(git tag --list --sort=v:refname)

          if [ "${#TAGS[@]}" -ge 2 ]; then
            for ((i=1; i<${#TAGS[@]}; i++)); do
              OLD="${TAGS[$((i-1))]}"
              NEW="${TAGS[$i]}"
              TAG_FILE="$OUTPUT_DIR/tag-${OLD}-to-${NEW}.md"

              {
                echo "# Release Comparison: $OLD to $NEW"
                echo
                echo "## Commit Summary"
                git log --reverse --date=short \
                  --format='- %h | %ad | %s' "$OLD..$NEW" || true
                echo
                echo "## Changed Files"
                git diff --name-status "$OLD" "$NEW"
                echo
                echo "## Change Statistics"
                git diff --stat "$OLD" "$NEW"
                echo
                echo "## Actual Code Changes"
                git diff --no-ext-diff --unified=2 --find-renames \
                  "$OLD" "$NEW" -- \
                  '*.py' '*.rb' '*.js' '*.ts' '*.html' '*.css' \
                  '*.toml' '*.cfg' '*.ini' '*.yml' '*.yaml' '*.md'
              } > "$TAG_FILE"
            done
          else
            echo "Not enough tags for release-to-release comparison." >> "$OUTPUT_DIR/manifest.md"
          fi

          echo "Generated comparison files:"
          find "$OUTPUT_DIR" -maxdepth 1 -type f -print

          test -s "$BRANCH_REPORT"
          test -s "$OUTPUT_DIR/manifest.md"

      - name: Upload comparison reports
        uses: actions/upload-artifact@v4
        with:
          name: bharat-filter-comparison-v2-${{ github.run_number }}
          path: comparison/
          if-no-files-found: error
          retention-days: 14
